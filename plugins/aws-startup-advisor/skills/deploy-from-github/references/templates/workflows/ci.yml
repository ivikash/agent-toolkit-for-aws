# Pull-request checks. Runs on every PR into main. Writes nothing to AWS.
#
# Jobs:
#   checks  - the project's own lint, test, and build (scripts/ci/build.sh check)
#   plan    - terraform plan for staging in every region, with the read-only plan
#             role. Only runs when DEPLOY_TARGET is "terraform". The plan goes to
#             the job summary, never into a PR comment (no pull-requests: write).
#             Production is planned in deploy.yml, in the same job that applies it.
#
# Repository variables this file reads (scripts/ci/set-github-variables.sh sets them):
#   APP_NAME, DEPLOY_TARGET, REGIONS, PRIMARY_REGION, TF_DIR,
#   AWS_ROLE_ARN_PLAN, TF_STATE_BUCKET_STAGING
#
# Every third-party action is pinned to a commit SHA. The trailing comment is the
# tag that SHA was resolved from. Update both together.

name: CI

on:
  pull_request:
    branches: [main]

# No default permissions. Each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint, test, and build without publishing
        run: ./scripts/ci/build.sh check

  plan:
    name: Plan staging ${{ matrix.region }}
    needs: checks
    if: vars.DEPLOY_TARGET == 'terraform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # The plan job carries its own environment so its OIDC subject is
    # repo:<org>/<repo>:environment:plan:ref:refs/pull/<n>/merge, which only the
    # read-only plan role trusts. See references/oidc-and-iam.md.
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(vars.REGIONS) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to AWS with the read-only plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ matrix.region }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ vars.TF_DIR }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_STAGING }}
          APP_NAME: ${{ vars.APP_NAME }}
          REGION: ${{ matrix.region }}
          PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
        run: |
          terraform init -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${APP_NAME}/staging/${REGION}/terraform.tfstate" \
            -backend-config="region=${PRIMARY_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate and plan
        working-directory: ${{ vars.TF_DIR }}
        env:
          REGION: ${{ matrix.region }}
        run: |
          terraform fmt -check -recursive -no-color
          terraform validate -no-color
          # -lock=false: a plan on a PR must never hold the state lock a deploy needs.
          terraform plan -no-color -lock=false -input=false \
            -var-file="env/staging.tfvars" \
            -var="region=${REGION}" \
            -var="image_tag=${GITHUB_SHA}" \
            -out=tfplan
          {
            echo "## Plan: staging ${REGION}"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
